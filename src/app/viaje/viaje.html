<button type="button" (click)="dibuja()" [disabled]="estaDibujando">
  {{ estaDibujando ? 'Dibujando...' : 'Dibujar' }}
</button>

<div class="image-container">
  <img src="/ViajeAlemania.png" alt="Viaje a Alemania">
  @for (point of drawnPoints; track $index) {
    <span
      class="red-dot"
      [style.left.%]="point.x"
      [style.top.%]="point.y"
      aria-hidden="true"
    ></span>
  }
</div>
