<button type="button" (click)="dibuja()" [disabled]="estaDibujando">
  {{ estaDibujando ? 'Dibujando...' : 'Dibujar' }}
</button>

<div
  class="image-container"
  (mousemove)="actualizaPosicion($event)"
  (mouseleave)="posicionRaton = null"
>
  <img src="/MapaSinChinchetas.jpeg" alt="Viaje a Alemania">
    <span
      class="red-dot"
      [style.left.%]="70"
      [style.top.%]="73"
      aria-hidden="true"
    ></span>
  @for (point of drawnPoints; track $index) {
    <span
      class="red-dot"
      [style.left.%]="point.x"
      [style.top.%]="point.y"
      aria-hidden="true"
    ></span>
  }
  <span
      class="red-dot"
      [style.left.%]="10"
      [style.top.%]="10"
      aria-hidden="true"
    ></span>
</div>
<output class="mouse-position" aria-live="polite">
    @if (posicionRaton; as posicion) {
      Ratón: X {{ posicion.x }}% · Y {{ posicion.y }}%
    } @else {
      Mueve el ratón sobre la imagen para ver su posición.
    }
</output>
